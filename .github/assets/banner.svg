<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 5s ease-in-out infinite}@keyframes dr{0%,70%{stroke-dashoffset:0}80%{stroke-dashoffset:900}100%{stroke-dashoffset:0}}
      .pop{animation:p 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes p{0%,70%{transform:scale(1)}80%{transform:scale(0)}100%{transform:scale(1)}}</style>
  </defs>
  <rect width="1200" height="320" fill="#fff7ed"/>
  <rect x="0" y="0" width="14" height="320" fill="#f05032"/>
  <!-- git graph -->
  <g transform="translate(640 0)" fill="none" stroke-width="6" stroke-linecap="round">
    <line x1="20" y1="160" x2="520" y2="160" stroke="#f05032"/>
    <path class="draw" d="M100 160C140 160 140 80 190 80H330C380 80 380 160 420 160" stroke="#2563eb"/>
    <path class="draw" d="M180 160C220 160 220 240 270 240H350" stroke="#16a34a"/>
    <g stroke="#fff7ed" stroke-width="4">
      <circle cx="20" cy="160" r="14" fill="#f05032"/><circle cx="100" cy="160" r="14" fill="#f05032"/><circle cx="180" cy="160" r="14" fill="#f05032"/><circle cx="300" cy="160" r="14" fill="#f05032"/><circle cx="420" cy="160" r="18" fill="#f05032"/><circle cx="520" cy="160" r="14" fill="#f05032"/>
      <circle class="pop" cx="230" cy="80" r="14" fill="#2563eb"/><circle class="pop" cx="300" cy="80" r="14" fill="#2563eb"/>
      <circle class="pop" cx="290" cy="240" r="14" fill="#16a34a"/><circle class="pop" cx="350" cy="240" r="14" fill="#16a34a"/>
    </g>
    <g font-family="Consolas, Menlo, monospace" font-size="14" stroke="none">
      <text x="200" y="52" fill="#2563eb">feature</text><text x="300" y="282" fill="#16a34a">fix</text><text x="470" y="140" fill="#f05032">main</text><text x="392" y="200" fill="#9a3412">merge</text>
    </g>
  </g>
  <text x="62" y="96" font-family="Consolas, Menlo, monospace" font-size="18" fill="#9a3412">$ git init &amp;&amp; git commit -m "lab 04"</text>
  <text x="58" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="900" fill="#1c1917">Lab 04<tspan fill="#f05032">.</tspan></text>
  <text x="62" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="300" fill="#44403c">Git — branch, commit, merge</text>
  <text x="62" y="278" font-family="Consolas, Menlo, monospace" font-size="15" fill="#a8a29e">CSE412 · Software Engineering</text>
</svg>
